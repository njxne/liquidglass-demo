name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Build debug & release
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug assembleRelease

      - name: Verify APK signatures
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(find "$SDK/build-tools" -maxdepth 1 -type d | sort | tail -1)
          APKSIGNER="$BT/apksigner"
          ZALIGN="$BT/zipalign"
          "$APKSIGNER" verify --print-certs -v app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs -v app/build/outputs/apk/release/app-release.apk
          "$ZALIGN" -c -p 4 app/build/outputs/apk/release/app-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/
          if-no-files-found: error

      - name: Publish release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LiquidGlass Demo v1.0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true